name: Fase padi per kecamatan DIY dari Sentinel-1

# Sentinel-1 melintas DIY ~10.57 UTC tiap 6 hari (S1C + S1D); Planetary Computer biasanya
# memuatnya dalam beberapa jam. Run harian 22.20 UTC (05.20 WIB) selesai sebelum
# pipeline SIGAP Pangan DIY (23.05 UTC) membaca deretnya untuk nowcast SIMOTANDI.
on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "harian (tambah tanggal baru) atau rujukan (hitung ulang seluruh riwayat)"
        required: false
        default: "harian"

permissions:
  contents: write

concurrency:
  group: s1-padi-kecamatan
  cancel-in-progress: false

jobs:
  olah:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q pystac-client planetary-computer rasterio numpy shapely requests pyshp
      - name: Batas kecamatan (sekali saja)
        run: |
          if [ ! -f config/batas_kecamatan_diy.geojson ]; then python tools/siapkan_batas_diy.py; fi
      - run: python src/s1_padi_kecamatan.py --mode "${{ github.event.inputs.mode || 'harian' }}"
      - name: Simpan
        if: always()
        run: |
          git add config/batas_kecamatan_diy.geojson 2>/dev/null || true
          bash tools/simpan.sh "s1-padi-kecamatan"
